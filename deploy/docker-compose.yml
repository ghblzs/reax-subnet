# Example: one miner and one validator on the mpm1 (rc3 fallback) mechanism. The release
# default is s1; these services pin REAX_MECHANISM=mpm1 explicitly. The s1 examples live in
# deploy/docker-compose.s1.yml (miner) and deploy/docker-compose.s1-validator.yml (validator).
# In production run miner and validator each on their own GPU machine.
# Usage (from the repository root):
#   cp deploy/miner.env.example deploy/miner.env; cp deploy/validator.env.example deploy/validator.env
#   docker build -t reax:1.2.0rc4 .
#   REAX_UID=$(id -u) REAX_GID=$(id -g) docker compose -f deploy/docker-compose.yml up -d --build
# Paths below are relative to this deploy/ directory.
services:
  miner:
    logging: {driver: json-file, options: {max-size: "50m", max-file: "5"}}  # bounded logs for long unattended runs
    build: ..
    image: reax:1.2.0rc4
    user: "${REAX_UID:?set REAX_UID=$(id -u)}:${REAX_GID:?set REAX_GID=$(id -g)}"  # key files are 0600, owned by you
    init: true
    env_file: miner.env
    environment:
      REAX_MECHANISM: mpm1
    ports: ["8091:8091"]
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - ${HOME}/.bittensor/wallets:/wallets:ro   # only <name>/hotkeys/<hotkey> and coldkeypub.txt are needed
      - models:/models
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    restart: unless-stopped
  validator:
    logging: {driver: json-file, options: {max-size: "50m", max-file: "5"}}  # bounded logs for long unattended runs
    image: reax:1.2.0rc4
    entrypoint: ["reax-validator"]
    user: "${REAX_UID:?set REAX_UID=$(id -u)}:${REAX_GID:?set REAX_GID=$(id -g)}"
    init: true
    env_file: validator.env
    environment:
      REAX_MECHANISM: mpm1
    healthcheck:
      disable: true            # the validator opens no port; monitor its logs
    volumes:
      - ${HOME}/.bittensor/wallets:/wallets:ro
      - models:/models
      - state:/state
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    restart: unless-stopped
volumes:
  models:
  state:
