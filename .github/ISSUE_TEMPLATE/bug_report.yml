name: Bug report
description: Something in the miner, validator, router or docs does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here; use the private advisory link on the issue chooser.
        Never paste wallets, keys, mnemonics, tokens or `.env` contents.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, image digest or commit
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [miner, validator, runtime sidecar, router, docs, other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (secrets removed)
      render: text
