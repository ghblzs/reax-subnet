name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (without the model extra; real-model tests are skipped)
        run: python -m pip install ".[test]"
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Tests
        run: python -m pytest -q
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install from the hash-pinned lock (same as the Docker image)
        run: python -m pip install --require-hashes -r requirements/lock.txt && python -m pip install --no-deps .
      - name: Tests against locked dependencies
        run: python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 && python -m pytest -q -m "not model"
